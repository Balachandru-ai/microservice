server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/users/ {
    proxy_pass http://user-service:5000/;
    proxy_set_header Host $host;
  }
  location /api/products {
    proxy_pass http://product-service:5000/products;
    proxy_set_header Host $host;
  }
  location /api/orders {
    proxy_pass http://order-service:5000/orders;
    proxy_set_header Host $host;
  }
  location /api/payments {
    proxy_pass http://payment-service:5000/payments;
    proxy_set_header Host $host;
  }
  location /api/notifications {
    proxy_pass http://notification-service:5000/notifications;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
