services:
  # ==============================
  # POSTGRESQL DATABASE
  # ==============================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ==============================
  # USER SERVICE
  # ==============================
  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopuser}:${POSTGRES_PASSWORD_URL:-localdevpassword}@postgres:5432/users_db
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==============================
  # PRODUCT SERVICE
  # ==============================
  product-service:
    build: ./services/product-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopuser}:${POSTGRES_PASSWORD_URL:-localdevpassword}@postgres:5432/products_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==============================
  # PAYMENT SERVICE
  # ==============================
  payment-service:
    build: ./services/payment-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopuser}:${POSTGRES_PASSWORD_URL:-localdevpassword}@postgres:5432/payments_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==============================
  # NOTIFICATION SERVICE
  # ==============================
  notification-service:
    build: ./services/notification-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopuser}:${POSTGRES_PASSWORD_URL:-localdevpassword}@postgres:5432/notifications_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==============================
  # ORDER SERVICE
  # ==============================
  order-service:
    build: ./services/order-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopuser}:${POSTGRES_PASSWORD_URL:-localdevpassword}@postgres:5432/orders_db
      PRODUCT_SERVICE_URL: http://product-service:5000
      PAYMENT_SERVICE_URL: http://payment-service:5000
      NOTIFICATION_SERVICE_URL: http://notification-service:5000
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  # ==============================
  # FRONTEND WEB
  # ==============================
  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    restart: unless-stopped

  # ==============================
  # PROMETHEUS
  # ==============================
  prometheus:
    image: prom/prometheus:latest
    container_name: shopsphere-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - node-exporter
      - cadvisor
      - postgres-exporter
    restart: unless-stopped

  # ==============================
  # GRAFANA
  # ==============================
  grafana:
    image: grafana/grafana:latest
    container_name: shopsphere-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ChangeThisStrongPassword}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ==============================
  # NODE EXPORTER - EC2 MONITORING
  # ==============================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: shopsphere-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped

  # ==============================
  # CADVISOR - DOCKER MONITORING
  # ==============================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: shopsphere-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  # ==============================
  # POSTGRESQL EXPORTER
  # ==============================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: shopsphere-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-shopuser}:${POSTGRES_PASSWORD_URL:-localdevpassword}@postgres:5432/postgres?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# ==============================
# PERSISTENT VOLUMES
# ==============================
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
